name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (engine + app, both stores)
        run: ./gradlew --stacktrace :core:engine:test testGoogleDebugUnitTest testRustoreDebugUnitTest

      - name: Lint
        run: ./gradlew lintGoogleDebug lintRustoreDebug

      - name: Assemble debug APKs
        run: ./gradlew assembleGoogleDebug assembleRustoreDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
