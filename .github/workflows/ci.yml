name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (engine + catalog + app, both stores)
        run: ./gradlew --stacktrace :core:engine:test :core:catalog:test testGoogleDebugUnitTest testRustoreDebugUnitTest

      - name: Lint
        run: ./gradlew lintGoogleDebug lintRustoreDebug

      - name: Lint findings as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('**/build/reports/lint-results-*.xml', recursive=True):
              for issue in ET.parse(f).getroot().iter('issue'):
                  if issue.get('severity') not in ('Error', 'Fatal'):
                      continue
                  loc = issue.find('location')
                  path = loc.get('file', '') if loc is not None else ''
                  line = loc.get('line', '1') if loc is not None else '1'
                  path = path.split('/yoga-mudrya/')[-1]
                  msg = (issue.get('id') + ': ' + issue.get('message', '')).replace('\n', ' ')
                  print(f"::error file={path},line={line}::{msg}")
          PY

      - name: Assemble debug APKs
        run: ./gradlew assembleGoogleDebug assembleRustoreDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
